[project]
name = "hanc_shoppinglist"
version = "0.1.1"
description = "Home Assistant custom integration for the Nextcloud Shopping List app"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
extend-select = [
  "B",    # bugbear
  "C4",   # comprehensions
  "DTZ",  # datetimez
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "PT",   # pytest style
  "RET",  # return
  "RUF",  # ruff-specific
  "SIM",  # simplify
  "T20",  # no print statements
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
ignore = [
  "SIM108",  # ternary is not always clearer
  "RET504",  # ignored by HA core as well
  "RUF012",  # mutable class attrs (HA uses ClassVar anyway)
]
unfixable = [
  "F841",  # unused local variable
]

[tool.ruff.lint.per-file-ignores]
# The multiplication sign is part of the documented summary format.
"custom_components/hanc_shopping_list/todo.py" = ["RUF001", "RUF002", "RUF003"]
"tests/**" = ["S101", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
